<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketTek Entegre Operasyon Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h3 { margin-top: 0; font-size: 16px; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-blue { background-color: #2563eb; }
        .btn-red { background-color: #dc2626; }
        .btn-whatsapp { background-color: #25d366; width: 100%; margin-top: 10px; font-size: 16px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .stat-box { flex: 1; text-align: center; padding: 15px; border-radius: 8px; }
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f1f5f9; }
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 300px; text-align: center; }
        #app-content { display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>MarketTek Giriş</h2>
        <input type="password" id="password" placeholder="Şifrenizi Girin">
        <button class="btn-blue" onclick="checkPassword()">Giriş Yap</button>
        <p style="font-size: 11px; color: #64748b; margin-top: 15px;">Varsayılan Şifre: 1234</p>
    </div>
</div>

<div id="app-content">
    <div class="container">
        <div style="background: #0f172a; color: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; text-align: center;">
            <div style="font-size: 22px; font-weight: bold;">🛒 MarketTek Operasyon</div>
        </div>

        <div class="card">
            <h3>⚡ 1. Şube İçi Pratik Çözüm</h3>
            <div class="btn-group">
                <button class="btn-blue" onclick="sendWhatsapp('Kasa Kilitlendi sorunu bildirildi.')">Kasa Kilitlendi</button>
                <button class="btn-blue" onclick="sendWhatsapp('İnternet Koptu bildirildi.')">İnternet Koptu</button>
                <button class="btn-blue" onclick="sendWhatsapp('Barkod Okumuyor bildirildi.')">Barkod Okumuyor</button>
            </div>
            <button class="btn-whatsapp" onclick="sendWhatsapp('Merhaba, genel destek talebinde bulunuyorum.')">📞 WhatsApp Canlı Destek Hattı</button>
        </div>

        <div class="card">
            <h3>🚨 2. Saha Ekibi Talep Formu</h3>
            <input type="text" id="subeAdi" placeholder="Şube Adı">
            <input type="text" id="arizaTuru" placeholder="Arıza Türü">
            <button class="btn-red" style="width: 100%;" onclick="talepGonder()">Bölgesel Ekibi Yönlendir</button>
        </div>

        <button class="btn-red" onclick="location.reload()" style="width: 100%; margin-bottom: 20px;">🔒 Güvenli Çıkış Yap</button>
    </div>
</div>

<script>
    function checkPassword() {
        if (document.getElementById('password').value === "1234") { 
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        } else { alert("Hatalı şifre!"); }
    }
    function sendWhatsapp(msg) {
        // BURAYI KENDİ NUMARANLA DEĞİŞTİR: 905321234567 formatında
        const telefonNumarasi = "905307464450"; 
        window.open("https://wa.me/" + telefonNumarasi + "?text=" + encodeURIComponent(msg), '_blank');
    }
    function talepGonder() {
        const mesaj = "YENİ TALEP: " + document.getElementById('subeAdi').value + " - " + document.getElementById('arizaTuru').value;
        sendWhatsapp(mesaj);
    }
</script>

</body>
</html>
